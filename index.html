<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="diegoquintana.ar es un dashboard personal para organizar tus apps web favoritas en un solo lugar. Agrega cualquier sitio como un marco, elige entre vistas de teléfono, tablet, escritorio o monitor, y personaliza tu espacio de trabajo con facilidad. Perfecto para acceder rápidamente a tus herramientas y sitios más usados, todo con una interfaz elegante y minimalista." />

  <title>diegoquintana.ar</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bar-h: 58px;
      --phone-w: 390px;
      --phone-h: 856px;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    #topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--bar-h);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 200;
      padding: 0 20px;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1),
                  opacity  0.3s cubic-bezier(0.4,0,0.2,1);
    }

    body.bar-hidden #topbar {
      transform: translateY(calc(-1 * var(--bar-h)));
      opacity: 0;
      pointer-events: none;
    }

    /* toggle pill */
    #bar-toggle {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 201;
      height: 24px;
      padding: 0 14px;
      background: rgba(30, 30, 30, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-top: none;
      border-radius: 0 0 10px 10px;
      color: rgba(255,255,255,0.4);
      font-size: 10px;
      font-family: inherit;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, background 0.15s, top 0.3s cubic-bezier(0.4,0,0.2,1);
      user-select: none;
    }
    #bar-toggle:hover { color: rgba(255,255,255,0.75); background: rgba(40,40,40,0.95); }
    body.bar-hidden #bar-toggle { top: 0; }
    body:not(.bar-hidden) #bar-toggle { top: var(--bar-h); }

    #bar-toggle .arrow {
      display: inline-block;
      transition: transform 0.3s;
      font-style: normal;
    }
    body.bar-hidden #bar-toggle .arrow { transform: rotate(180deg); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: #121212;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── Responsive: mobile ≤900px ── */
    @media (max-width: 900px) {
      :root { --bar-h: 108px; }

      #topbar {
        height: auto;
        min-height: var(--bar-h);
        flex-wrap: wrap;
        align-content: center;
        gap: 6px 8px;
        padding: 8px 12px;
        justify-content: flex-start;
      }

      .input-wrap {
        width: 100%;
        flex: 0 0 100%;
      }

      #url-input {
        flex: 1;
        width: auto !important;
        min-width: 0;
        font-size: 13px;
      }

      .zoom-strip {
        flex: 1;
        justify-content: center;
      }

      .device-strip { display: none; }
      #hints        { display: none; }
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #url-input {
      flex: 1;
      width: min(480px, calc(100vw - 220px));
      height: 38px;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f2f2f2;
      padding: 0 14px;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      letter-spacing: 0.01em;
    }

    #url-input::placeholder { color: rgba(255, 255, 255, 0.22); }

    #url-input:focus {
      border-color: rgba(99, 132, 255, 0.75);
      background: rgba(255, 255, 255, 0.11);
      box-shadow: 0 0 0 3px rgba(99, 132, 255, 0.13);
    }

    #url-input.invalid {
      border-color: rgba(255, 90, 90, 0.7);
      animation: shake 0.28s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-5px); }
      75%       { transform: translateX(5px); }
    }

    #add-btn {
      flex-shrink: 0;
      width: 34px;
      height: 38px;
      border-radius: 7px;
      background: #5c7dff;
      border: none;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    #add-btn:hover  { background: #7592ff; }
    #add-btn:active { transform: scale(0.9); }

    #reset-btn {
      flex-shrink: 0;
      width: 34px;
      height: 38px;
      border-radius: 7px;
      background: #5c7dff;
      border: none;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    #reset-btn:hover  { background: #7592ff; }
    #reset-btn:active { transform: scale(0.9); }

    /* Zoom strip */
    .zoom-strip {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 9px;
      padding: 3px;
    }

    .z-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .z-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

    /* ── Device picker ─────────────────────────────────────────── */
    .device-strip {
      display: flex;
      gap: 2px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 9px;
      padding: 3px;
    }
    .dev-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
    }
    .dev-btn:hover  { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .dev-btn.active { background: rgba(99, 132, 255, 0.2); color: #7fa3ff; }

    #zoom-label {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.38);
      min-width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* ── Canvas ───────────────────────────────────────────────── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── Frame wrapper ────────────────────────────────────────── */
    .fw {
      position: absolute;
    }

    .fw.entering {
      animation: pop-in 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    }

    .fw-shell {
      outline: 2.5px solid transparent;
      outline-offset: 3px;
      transition: outline-color 0.15s, filter 0.15s;
    }
    .fw.focused .fw-shell {
      outline-color: rgba(99, 132, 255, 0.7);
      filter: drop-shadow(0 0 14px rgba(99, 132, 255, 0.28));
    }

    @keyframes pop-in {
      from { opacity: 0; transform: rotate(var(--rot, 0deg)) scale(0.85); }
      to   { opacity: 1; transform: rotate(var(--rot, 0deg)) scale(1); }
    }

    /* label above phone */
    .fw-label {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      right: 0;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      padding: 0 4px;
    }

    .fw-label:active { cursor: grabbing; }

    .fw-title {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .fw-close {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 75, 75, 0.12);
      border: 1px solid rgba(255, 75, 75, 0.28);
      color: rgba(255, 100, 100, 0.7);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .fw-close:hover { background: rgba(255, 70, 70, 0.45); color: #fff; }

    .fw-open {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
      line-height: 1;
    }
    .fw-open:hover { background: rgba(255,255,255,0.14); color: #fff; }

    /* per-frame device picker */
    .fw-devs { display: flex; gap: 2px; flex-shrink: 0; }
    .fw-devs button {
      width: 32px; height: 32px; border-radius: 7px; border: none;
      background: transparent; font-size: 16px; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .fw-devs button:hover  { background: rgba(255,255,255,0.1); }
    .fw-devs button.active { background: rgba(99,132,255,0.25); }

    /* ── Phone ────────────────────────────────────────────────── */
    .phone {
      width: var(--phone-w);
      height: var(--phone-h);
      position: relative;
      background: linear-gradient(158deg, #2e2e2e 0%, #191919 100%);
      border-radius: 54px;
      border: 1.5px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, 0.6),
        0 32px 80px rgba(0, 0, 0, 0.6),
        0 0 0 0.5px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    /* volume buttons */
    .phone::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 90px;
      width: 3px;
      height: 28px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 2px 0 0 2px;
      box-shadow: 0 44px 0 rgba(255, 255, 255, 0.14);
    }

    /* power button */
    .phone::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 108px;
      width: 3px;
      height: 60px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 0 2px 2px 0;
    }

    .phone-island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 116px;
      height: 34px;
      background: #000;
      border-radius: 22px;
      z-index: 4;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .phone-screen {
      position: absolute;
      top: 54px;
      left: 10px;
      right: 10px;
      bottom: 28px;
      border-radius: 46px;
      overflow: hidden;
      background: #050505;
    }

    .phone-screen iframe {
      display: block;
      border: none;
      width: 390px;
      height: 844px;
      transform: scale(0.94872);
      transform-origin: 0 0;
    }

    .phone-home {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 2px;
      z-index: 3;
    }

    /* blocked-iframe overlay */
    .blocked {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background: #0a0a0a;
    }

    .blocked.visible { display: flex; }

    .blocked svg { opacity: 0.22; }

    .blocked-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.32);
      text-align: center;
      line-height: 1.55;
    }

    .blocked-link {
      font-size: 12px;
      color: #6b8fff;
      text-decoration: none;
      padding: 7px 16px;
      border: 1px solid rgba(107, 143, 255, 0.3);
      border-radius: 7px;
      transition: background 0.15s;
    }

    .blocked-link:hover { background: rgba(107, 143, 255, 0.12); }

    /* ── Tablet ──────────────────────────────────────────────── */
    .tablet-outer {
      width: 600px; height: 840px;
      background: linear-gradient(158deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 32px 80px rgba(0,0,0,0.6);
      position: relative; overflow: hidden;
    }
    .tablet-camera {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      width: 9px; height: 9px;
      background: #111; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1); z-index: 4;
    }
    .tablet-screen {
      position: absolute;
      top: 26px; left: 16px; right: 16px; bottom: 16px;
      border-radius: 8px; overflow: hidden; background: #050505;
    }
    .tablet-screen iframe {
      display: block; border: none;
      width: 768px; height: 1024px;
      transform: scale(0.7396); transform-origin: 0 0;
    }

    /* ── Desktop (laptop) ────────────────────────────────────── */
    .desktop-wrap  { position: relative; width: 1100px; }
    .desktop-outer {
      width: 1100px; height: 720px;
      background: #1c1c1e;
      border-radius: 10px 10px 0 0;
      border: 1.5px solid rgba(255,255,255,0.1); border-bottom: none;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      position: relative; overflow: hidden;
    }
    .desktop-chrome {
      position: absolute; top: 0; left: 0; right: 0; height: 36px;
      background: #2a2a2c;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex; align-items: center; padding: 0 12px; gap: 6px; z-index: 4;
    }
    .chrome-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .chrome-dot.red    { background: #ff5f57; }
    .chrome-dot.yellow { background: #febc2e; }
    .chrome-dot.green  { background: #28c840; }
    .chrome-urlbar {
      flex: 1; height: 20px;
      background: rgba(255,255,255,0.05); border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.06); margin: 0 14px;
    }
    .desktop-screen {
      position: absolute; top: 36px; left: 0; right: 0; bottom: 0;
      overflow: hidden; background: #fff;
    }
    .desktop-screen iframe {
      display: block; border: none;
      width: 1440px; height: 900px;
      transform: scale(0.7639); transform-origin: 0 0;
    }
    .desktop-base {
      width: 1100px; height: 16px;
      background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
      border-radius: 0 0 10px 10px;
      border: 1.5px solid rgba(255,255,255,0.08); border-top: none;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    /* ── Monitor ─────────────────────────────────────────────── */
    .monitor-outer { position: relative; width: 1400px; }
    .monitor-screen-wrap {
      width: 1400px; height: 820px;
      background: #0d0d0d;
      border-radius: 10px 10px 5px 5px;
      border: 14px solid #1e1e1e; border-bottom-width: 20px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.04);
      position: relative; overflow: hidden; box-sizing: border-box;
    }
    .monitor-screen { position: absolute; inset: 0; overflow: hidden; background: #050505; }
    .monitor-screen iframe {
      display: block; border: none;
      width: 1920px; height: 1080px;
      transform: scale(0.7146); transform-origin: 0 0;
    }
    .monitor-neck {
      width: 180px; height: 32px;
      background: linear-gradient(180deg, #222 0%, #1a1a1a 100%);
      margin: 0 auto;
      clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    }
    .monitor-foot {
      width: 480px; height: 14px; background: #1a1a1a;
      border-radius: 0 0 14px 14px; margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    /* ── Text nodes ─────────────────────────────────────────────── */
    #text-btn {
      flex-shrink: 0;
      width: 34px;
      height: 38px;
      border-radius: 7px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: -0.03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    #text-btn:hover  { background: rgba(255,255,255,0.13); color: #fff; }
    #text-btn:active { transform: scale(0.9); }

    .tw { position: absolute; }

    .tw.entering {
      animation: pop-in 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
    }

    .tw-handle {
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 2px;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tw:hover .tw-handle { opacity: 1; }
    .tw-handle:active { cursor: grabbing; }

    .tw-close {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 75, 75, 0.12);
      border: 1px solid rgba(255, 75, 75, 0.28);
      color: rgba(255, 100, 100, 0.7);
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .tw-close:hover { background: rgba(255, 70, 70, 0.45); color: #fff; }

    .tw-body {
      outline: none;
      color: rgba(255, 255, 255, 0.88);
      font-family: inherit;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.45;
      width: 100%;
      box-sizing: border-box;
      min-height: 26px;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: text;
      caret-color: #7fa3ff;
      padding: 4px 6px;
      border-radius: 5px;
      transition: background 0.15s;
    }
    .tw-body:focus { background: rgba(255,255,255,0.04); }
    .tw-body:empty::before {
      content: 'Texto…';
      color: rgba(255,255,255,0.2);
      pointer-events: none;
    }

    .tw-resize-r {
      position: absolute;
      right: -6px;
      top: 22px;          /* debajo del handle de arrastre */
      bottom: 18px;       /* por encima del corner diagonal */
      width: 12px;
      cursor: ew-resize;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tw:hover .tw-resize-r { opacity: 1; }
    .tw-resize-r::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 15%;
      bottom: 15%;
      width: 2.5px;
      border-radius: 1px;
      background: rgba(99, 132, 255, 0.55);
    }

    .tw-resize-br {
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tw:hover .tw-resize-br { opacity: 1; }
    .tw-resize-br::after {
      content: '';
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 9px;
      height: 9px;
      border-right: 2.5px solid rgba(99, 132, 255, 0.75);
      border-bottom: 2.5px solid rgba(99, 132, 255, 0.75);
      border-radius: 0 0 3px 0;
    }

    /* ── Rotation handle ──────────────────────────────────── */
    .tw-rotate {
      position: absolute;
      left: -9px;
      top: -9px;
      width: 20px;
      height: 20px;
      cursor: grab;
      z-index: 4;
      opacity: 0;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: rgba(99, 132, 255, 0.85);
      user-select: none;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.85);
      border: 1px solid rgba(99, 132, 255, 0.35);
    }
    .tw:hover .tw-rotate { opacity: 1; }
    .tw-rotate:active { cursor: grabbing; }

    .tw-rot-badge {
      position: absolute;
      left: 16px;
      top: -20px;
      background: rgba(18, 18, 18, 0.92);
      border: 1px solid rgba(99, 132, 255, 0.4);
      border-radius: 6px;
      font-size: 10px;
      font-family: monospace;
      color: rgba(99, 132, 255, 0.95);

    #layers-header {
      height: 38px;

    .layer-name {

    .layer-eye, .layer-del {

      color: rgba(255,255,255,0.25);

      border-radius: 4px;

    .layer-item:hover .layer-eye,
    .layer-item:hover .layer-del  { opacity: 1; }
    .layer-eye:hover { color: rgba(255,255,255,0.8); }
    .layer-del:hover { color: rgba(255,70,70,0.9); background: rgba(255,70,70,0.12); }
    .layer-item.layer-hidden .layer-eye { opacity: 0.6; }

    .layer-drag-handle {
      cursor: grab;
      opacity: 0;
      font-size: 13px;
      line-height: 1;

      color: rgba(255,255,255,0.5);

    .layer-item:hover .layer-drag-handle { opacity: 0.45; }
    .layer-drag-handle:active { cursor: grabbing; }

    .layer-item.layer-drag-over::before {
      content: '';
      display: block;
      position: absolute;
      left: 6px; right: 6px; top: -1px;
      height: 2px;
      background: rgba(99,132,255,0.8);
      border-radius: 2px;

    }
  </style>
</head>

<!-- Grid canvas -->

  <div id="world"></div>
</div>

<!-- Empty state -->

  <svg width="60" height="60" viewBox="0 0 24 24" fill="none"
       stroke="rgba(255,255,255,.7)" stroke-width="1.1">

    <line x1="9" y1="7"  x2="15" y2="7"/>
    <line x1="9" y1="11" x2="15" y2="11"/>
    <line x1="9" y1="15" x2="13" y2="15"/>
  </svg>
  <h2>Tu dashboard está vacío</h2>

<!-- Keyboard shortcuts -->

  <span class="hint"><kbd>Ctrl</kbd> + scroll — zoom</span>
  <span class="hint"><kbd>Espacio</kbd> + arrastrar — mover canvas</span>
  <span class="hint">Arrastrar etiqueta — mover frame</span>
  <span class="hint"><kbd>Ctrl 0</kbd> — restablecer vista</span>
  <span class="hint"><kbd>T</kbd> — agregar texto</span>
  <span class="hint"><kbd>L</kbd> — capas</span>
</div>

<script>
/* =====================================================================
   State
===================================================================== */
const T = { x: 0, y: 0, s: 1 };   // canvas transform
let frames   = [];
let texts    = [];
let idSeq    = 1;
let panning  = false;
let panStart = { x: 0, y: 0 };
let spaceDown = false;
let dragging = null;  // { data, el, ox, oy }
let zSeq = 100;       // stacking order counter

const DEVICES = {
  mobile:  { outerW: 390,  outerH: 856  },
  tablet:  { outerW: 600,  outerH: 840  },
  desktop: { outerW: 1100, outerH: 736  },
  monitor: { outerW: 1400, outerH: 866  },
};
let selectedDevice = 'mobile';

/* =====================================================================
   DOM refs
===================================================================== */
const bgCvs   = document.getElementById('bg-canvas');
const vp      = document.getElementById('viewport');
const world   = document.getElementById('world');
const urlInp  = document.getElementById('url-input');
const addBtn  = document.getElementById('add-btn');
const zoomLbl = document.getElementById('zoom-label');
const emptyEl = document.getElementById('empty');

/* =====================================================================
   Transform
===================================================================== */
function applyT() {
  world.style.transform = `translate(${T.x}px,${T.y}px) scale(${T.s})`;
  zoomLbl.textContent   = Math.round(T.s * 100) + '%';
  drawGrid();
}

function zoomTo(newS, cx, cy) {
  newS = Math.min(5, Math.max(0.06, newS));
  const px = cx ?? innerWidth  / 2;
  const py = cy ?? innerHeight / 2;
  const f  = newS / T.s;
  T.x = px - (px - T.x) * f;
  T.y = py - (py - T.y) * f;
  T.s = newS;
  applyT();
}

function resetView() {
  T.x = innerWidth  / 2;
  T.y = innerHeight / 2;
  T.s = 1;
  applyT();
}

/* =====================================================================
   Dot-grid background
===================================================================== */
function drawGrid() {
  const ctx = bgCvs.getContext('2d');
  const W   = bgCvs.width  = innerWidth;
  const H   = bgCvs.height = innerHeight;
  ctx.clearRect(0, 0, W, H);

  function grid(base, color) {
    const sz = base * T.s;
    if (sz < 6 || sz > 480) return;
    const ox = ((T.x % sz) + sz) % sz;
    const oy = ((T.y % sz) + sz) % sz;
    ctx.fillStyle = color;
    for (let x = ox - sz; x < W + sz; x += sz)
      for (let y = oy - sz; y < H + sz; y += sz)
        ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
  }

  grid(24,  'rgba(255,255,255,0.12)');
  grid(120, 'rgba(255,255,255,0.22)');
}

/* =====================================================================
   Persistence  (localStorage)
===================================================================== */
const STORAGE_KEY = 'canvas_state_v1';

function saveState() {
  try {
    const state = {
      frames: frames.map(f => { const el = document.getElementById('fw-'+f.id); return { id: f.id, url: f.url, device: f.device, x: f.x, y: f.y, visible: f.visible !== false, zOrder: el ? (parseInt(el.style.zIndex)||0) : 0 }; }),
      texts:  texts.map(t => { const el = document.getElementById('tw-'+t.id); return { id: t.id, text: t.text, x: t.x, y: t.y, w: t.w, fontSize: t.fontSize, rotation: t.rotation||0, visible: t.visible !== false, zOrder: el ? (parseInt(el.style.zIndex)||0) : 0 }; }),
      idSeq,
      T: { x: T.x, y: T.y, s: T.s },
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch {}
  renderLayers();
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const state = JSON.parse(raw);
    if (!state || !Array.isArray(state.frames)) return false;

    if (state.T) { T.x = state.T.x; T.y = state.T.y; T.s = state.T.s; }
    idSeq = state.idSeq ?? (state.frames.length + 1);

    state.frames.forEach(f => {
      frames.push(f);
      buildFrame(f);
    });

    if (Array.isArray(state.texts)) {
      state.texts.forEach(t => {
        texts.push(t);
        buildTextNode(t);
      });
    }

    if (frames.length || texts.length) emptyEl.classList.add('hidden');
    applyT();
    return true;
  } catch { return false; }
}

/* =====================================================================
   URL helpers
===================================================================== */
function youtubeEmbedUrl(raw) {
  const m = raw.match(
    /(?:(?:www\.)?youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
  );
  if (!m) return null;
  const origin = encodeURIComponent(window.location.origin);
  return `https://www.youtube.com/embed/${m[1]}?enablejsapi=1&origin=${origin}`;
}

function isAllowedUrl(url) {
  let parsed;
  try { parsed = new URL(url); } catch { return false; }
  const h = parsed.hostname.toLowerCase();
  return (
    /^(www\.)?youtube\.com$/.test(h) ||                           // youtube
    /^[^.]+\.github\.io$/.test(h) ||                              // *.github.io
    h === 'diegoquintana.ar' || h.endsWith('.diegoquintana.ar') || // diegoquintana.ar y subdominios
    /^[a-z-]+\.wikipedia\.org$/.test(h)                           // wikipedia (any language)
  );
}

function normalizeUrl(raw) {
  raw = raw.trim();
  if (!raw) return null;
  // YouTube → convert to embed URL
  const yt = youtubeEmbedUrl(raw);
  if (yt) return yt;
  if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
  try { new URL(raw); } catch { return null; }
  if (!isAllowedUrl(raw)) return null;
  return raw;
}

/* =====================================================================
   Add / remove frames
===================================================================== */
function addFrame(raw) {
  const url = normalizeUrl(raw);
  if (!url) {
    urlInp.classList.remove('invalid');
    void urlInp.offsetWidth;           // reflow to restart animation
    urlInp.classList.add('invalid');
    urlInp.addEventListener('animationend', () => urlInp.classList.remove('invalid'), { once: true });
    return;
  }

  const id  = idSeq++;
  const nth = frames.length;
  const dev = DEVICES[selectedDevice] || DEVICES.mobile;

  /* place centered on visible canvas, offset per frame */
  const cx = (innerWidth  / 2 - T.x) / T.s - dev.outerW / 2 + nth * 40;
  const cy = (innerHeight / 2 - T.y) / T.s - dev.outerH / 2 + nth * 40;

  const data = { id, url, device: selectedDevice, x: cx, y: cy };
  frames.push(data);
  buildFrame(data);
  saveState();

  urlInp.value = '';
  emptyEl.classList.add('hidden');
}

function removeFrame(id) {
  frames = frames.filter(f => f.id !== id);
  document.getElementById('fw-' + id)?.remove();
  if (!frames.length && !texts.length) emptyEl.classList.remove('hidden');
  saveState();
}

function rebuildFrame(data, newDevice) {
  data.device = newDevice;
  document.getElementById('fw-' + data.id)?.remove();
  buildFrame(data);
  saveState();
}

function buildFrame(data) {
  const { id, url, device = 'mobile' } = data;
  const isYT = /www\.youtube\.com\/embed\//.test(url);

  /* wrapper */
  const fw = document.createElement('div');
  fw.className = 'fw entering';
  fw.id = 'fw-' + id;
  fw.style.cssText = `left:${data.x}px;top:${data.y}px`;
  fw.addEventListener('animationend', () => fw.classList.remove('entering'), { once: true });

  /* label */
  const label = document.createElement('div');
  label.className = 'fw-label';

  const title = document.createElement('span');
  title.className = 'fw-title';
  try {
    const u = new URL(url);
    const ytId = u.pathname.match(/^\/embed\/([A-Za-z0-9_-]{11})/);
    title.textContent = ytId ? `▶ YouTube · ${ytId[1]}` : u.hostname;
  } catch { title.textContent = url; }

  /* per-frame device switcher */
  const devStrip = document.createElement('div');
  devStrip.className = 'fw-devs';
  const DEV_ICONS = { mobile: '📱', tablet: '⬜', desktop: '💻', monitor: '🖥' };
  Object.keys(DEV_ICONS).forEach(dev => {
    const b = document.createElement('button');
    b.textContent = DEV_ICONS[dev];
    b.title = dev.charAt(0).toUpperCase() + dev.slice(1);
    if (dev === device) b.classList.add('active');
    b.addEventListener('click', e => { e.stopPropagation(); rebuildFrame(data, dev); });
    devStrip.appendChild(b);
  });

  const openBtn = document.createElement('a');
  openBtn.className = 'fw-open';
  openBtn.title = 'Abrir en nueva pestaña';
  openBtn.innerHTML = '&#8599;';
  openBtn.setAttribute('target', '_blank');
  openBtn.setAttribute('rel', 'noopener noreferrer');
  /* for YouTube show the watch URL, otherwise use the raw url */
  try {
    const ytId2 = new URL(url).pathname.match(/^\/embed\/([A-Za-z0-9_-]{11})/);
    openBtn.href = ytId2 ? `https://www.youtube.com/watch?v=${ytId2[1]}` : url;
  } catch { openBtn.href = url; }
  openBtn.addEventListener('click', e => e.stopPropagation());

  const closeBtn = document.createElement('button');
  closeBtn.className = 'fw-close';
  closeBtn.innerHTML = '✕';
  closeBtn.title = 'Cerrar';
  closeBtn.addEventListener('click', e => { e.stopPropagation(); removeFrame(id); });
  label.append(title, openBtn, devStrip, closeBtn);

  /* iframe */
  const iframe = document.createElement('iframe');
  iframe.src   = url;
  iframe.title = url;
  if (isYT) {
    iframe.setAttribute('allow',
      'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    iframe.allowFullscreen = true;
  } else {
    iframe.setAttribute('sandbox',
      'allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock');
    iframe.setAttribute('allow',
      'accelerometer; camera; encrypted-media; geolocation; gyroscope; microphone');
  }
  iframe.setAttribute('loading', 'lazy');

  /* blocked overlay */
  const blocked = document.createElement('div');
  blocked.className = 'blocked';
  if (isYT) {
    const watchUrl = url.replace(/www\.youtube\.com\/embed\/([A-Za-z0-9_-]{11}).*/, 'www.youtube.com/watch?v=$1');
    blocked.innerHTML = `
      <svg width="44" height="44" viewBox="0 0 24 24" fill="#ff0000" opacity="0.6">
        <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/>
        <polygon points="9.7 15.5 15.8 12 9.7 8.5" fill="white"/>
      </svg>
      <p class="blocked-text" style="font-size:12px;line-height:1.6">
        YouTube bloquea embeds desde<br><code style="font-size:10px;opacity:.6">file://</code> — serví la app por HTTP:
      </p>
      <code style="font-size:10px;color:rgba(255,255,255,.35);text-align:center;padding:6px 10px;background:rgba(255,255,255,.05);border-radius:6px;white-space:nowrap">node server.js</code>
      <a class="blocked-link" href="${watchUrl}" target="_blank" rel="noopener noreferrer">
        Ver en YouTube →
      </a>`;
  } else {
    blocked.innerHTML = `
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
           stroke="rgba(255,255,255,.7)" stroke-width="1.3">
        <circle cx="12" cy="12" r="10"/>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
      </svg>
      <p class="blocked-text">Este sitio no permite<br>mostrarse dentro de un frame</p>
      <a class="blocked-link" href="${url}" target="_blank" rel="noopener noreferrer">
        Abrir en nueva pestaña →
      </a>`;
  }

  iframe.addEventListener('error', () => {
    iframe.style.display = 'none';
    blocked.classList.add('visible');
  });

  if (isYT) {
    /* YouTube error 150/153 arrives via postMessage from the player */
    const ytHandler = e => {
      try {
        const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        const hasError =
          (d && d.event === 'infoDelivery' && d.info && d.info.error) ||
          (d && d.event === 'onError' && d.info);
        if (hasError) {
          iframe.style.display = 'none';
          blocked.classList.add('visible');
          window.removeEventListener('message', ytHandler);
        }
      } catch {}
    };
    window.addEventListener('message', ytHandler);
  }

  /* device shell */
  let shell;
  if (device === 'tablet') {
    const outer = document.createElement('div');
    outer.className = 'tablet-outer';
    const cam = document.createElement('div');
    cam.className = 'tablet-camera';
    const screen = document.createElement('div');
    screen.className = 'tablet-screen';
    screen.append(iframe, blocked);
    outer.append(cam, screen);
    shell = outer;

  } else if (device === 'desktop') {
    const wrap = document.createElement('div');
    wrap.className = 'desktop-wrap';
    const outer = document.createElement('div');
    outer.className = 'desktop-outer';
    const chrome = document.createElement('div');
    chrome.className = 'desktop-chrome';
    chrome.innerHTML = `
      <div class="chrome-dot red"></div>
      <div class="chrome-dot yellow"></div>
      <div class="chrome-dot green"></div>
      <div class="chrome-urlbar"></div>`;
    const screen = document.createElement('div');
    screen.className = 'desktop-screen';
    screen.append(iframe, blocked);
    outer.append(chrome, screen);
    const base = document.createElement('div');
    base.className = 'desktop-base';
    wrap.append(outer, base);
    shell = wrap;

  } else if (device === 'monitor') {
    const outer = document.createElement('div');
    outer.className = 'monitor-outer';
    const wrap = document.createElement('div');
    wrap.className = 'monitor-screen-wrap';
    const screen = document.createElement('div');
    screen.className = 'monitor-screen';
    screen.append(iframe, blocked);
    wrap.append(screen);
    const neck = document.createElement('div');
    neck.className = 'monitor-neck';
    const foot = document.createElement('div');
    foot.className = 'monitor-foot';
    outer.append(wrap, neck, foot);
    shell = outer;

  } else {
    /* mobile (default) */
    const phone = document.createElement('div');
    phone.className = 'phone';
    const island = document.createElement('div');
    island.className = 'phone-island';
    const screen = document.createElement('div');
    screen.className = 'phone-screen';
    screen.append(iframe, blocked);
    const homeBar = document.createElement('div');
    homeBar.className = 'phone-home';
    phone.append(island, screen, homeBar);
    shell = phone;
  }

  shell.classList.add('fw-shell');
  fw.append(label, shell);
  world.appendChild(fw);
  { const _z = data.zOrder || ++zSeq; if (data.zOrder > zSeq) zSeq = data.zOrder; fw.style.zIndex = _z; }
  if (data.visible === false) fw.style.visibility = 'hidden';

  /* focus frame on bezel click */
  shell.addEventListener('mousedown', () => {
    fw.style.zIndex = ++zSeq;
    document.querySelectorAll('.fw.focused').forEach(el => el.classList.remove('focused'));
    fw.classList.add('focused');
  });

  /* double-click label → zoom-to-fit toggle */
  label.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (_fsFrame === fw) {
      exitFs();
    } else {
      enterFs(fw, data);
    }
  });

  /* drag label → move frame */
  label.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    fw.style.zIndex = ++zSeq;
    e.stopPropagation();
    e.preventDefault();
    const cx = (e.clientX - T.x) / T.s;
    const cy = (e.clientY - T.y) / T.s;
    dragging = { data, el: fw, ox: cx - data.x, oy: cy - data.y };
    world.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
    document.body.style.userSelect = 'none';
  });
}

/* =====================================================================
   Text nodes
===================================================================== */
function addTextNode() {
  const id = idSeq++;
  const cx = (innerWidth  / 2 - T.x) / T.s - 60;
  const cy = (innerHeight / 2 - T.y) / T.s - 20;
  const data = { id, text: '', x: cx, y: cy, w: 240, fontSize: 32 };
  texts.push(data);
  const el = buildTextNode(data);
  el.querySelector('.tw-body').focus();
  emptyEl.classList.add('hidden');
  saveState();
}

function buildTextNode(data) {
  const tw = document.createElement('div');
  tw.className = 'tw entering';
  tw.id = 'tw-' + data.id;
  if (!data.w)        data.w        = 240;
  if (!data.fontSize) data.fontSize = 18;
  if (!data.rotation) data.rotation = 0;
  { const _z = data.zOrder || ++zSeq; if (data.zOrder > zSeq) zSeq = data.zOrder; tw.style.cssText = `left:${data.x}px;top:${data.y}px;width:${data.w}px;z-index:${_z}`; }
  tw.style.setProperty('--rot', data.rotation + 'deg');
  if (data.visible === false) tw.style.visibility = 'hidden';
  tw.addEventListener('animationend', () => {
    tw.classList.remove('entering');
    tw.style.transform = 'rotate(' + data.rotation + 'deg)';
  }, { once: true });

  /* handle: drag zone + close button */
  const handle = document.createElement('div');
  handle.className = 'tw-handle';

  const closeBtn = document.createElement('button');
  closeBtn.className = 'tw-close';
  closeBtn.innerHTML = '✕';
  closeBtn.title = 'Eliminar';
  closeBtn.addEventListener('mousedown', e => e.stopPropagation());
  closeBtn.addEventListener('click', e => {
    e.stopPropagation();
    texts = texts.filter(t => t.id !== data.id);
    tw.remove();
    if (!frames.length && !texts.length) emptyEl.classList.remove('hidden');
    saveState();
  });
  handle.appendChild(closeBtn);

  /* editable body */
  const body = document.createElement('div');
  body.className = 'tw-body';
  body.contentEditable = 'true';
  body.spellcheck = false;
  if (data.text) body.textContent = data.text;
  body.style.fontSize = data.fontSize + 'px';

  body.addEventListener('focus', () => tw.classList.add('focused'));
  body.addEventListener('blur',  () => tw.classList.remove('focused'));

  body.addEventListener('input', () => {
    data.text = body.textContent;
    saveStateDeferred();
  });
  body.addEventListener('mousedown', e => {
    tw.style.zIndex = ++zSeq;
    e.stopPropagation();
  });

  /* drag via handle */
  handle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    tw.style.zIndex = ++zSeq;
    e.stopPropagation();
    e.preventDefault();
    const cx = (e.clientX - T.x) / T.s;
    const cy = (e.clientY - T.y) / T.s;
    dragging = { data, el: tw, ox: cx - data.x, oy: cy - data.y };
    world.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
    document.body.style.userSelect = 'none';
  });

  /* right-edge resize handle (solo ancho) */
  const resizeR = document.createElement('div');
  resizeR.className = 'tw-resize-r';
  resizeR.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    tw.style.zIndex = ++zSeq;
    e.stopPropagation();
    e.preventDefault();
    const startX = e.clientX;
    const startW = data.w;
    function onMove(ev) {
      const dx = (ev.clientX - startX) / T.s;
      data.w = Math.max(80, Math.round(startW + dx));
      tw.style.width = data.w + 'px';
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      saveState();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });

  /* diagonal resize handle (bottom-right) */
  const resizeBr = document.createElement('div');
  resizeBr.className = 'tw-resize-br';
  resizeBr.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    tw.style.zIndex = ++zSeq;
    e.stopPropagation();
    e.preventDefault();
    const startX     = e.clientX;
    const startY     = e.clientY;
    const startW     = data.w;
    const startFS    = data.fontSize;
    function onMove(ev) {
      const dx    = (ev.clientX - startX) / T.s;
      const dy    = (ev.clientY - startY) / T.s;
      const diag  = (dx + dy) / 2;
      const scale = Math.max(0.1, (startW + diag) / startW);
      data.w        = Math.max(80, Math.round(startW * scale));
      data.fontSize = Math.max(8, Math.round(startFS * scale));
      tw.style.width        = data.w + 'px';
      body.style.fontSize   = data.fontSize + 'px';
    }
    function onUp() {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      saveState();
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  });

  tw.append(handle, body, resizeR, resizeBr);

  /* rotation handle (top-left corner) */
  const rotHandle = document.createElement('div');
  rotHandle.className = 'tw-rotate';
  rotHandle.title = 'Rotar  /  doble clic →0°';
  rotHandle.textContent = '↺';

  const rotBadge = document.createElement('div');
  rotBadge.className = 'tw-rot-badge';

  rotHandle.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    tw.style.zIndex = ++zSeq;
    const cx_w     = data.x + tw.offsetWidth  / 2;
    const cy_w     = data.y + tw.offsetHeight / 2;
    const startMx  = (e.clientX - T.x) / T.s;
    const startMy  = (e.clientY - T.y) / T.s;
    const startAng = Math.atan2(startMy - cy_w, startMx - cx_w) * 180 / Math.PI;
    const startRot = data.rotation || 0;
    rotBadge.style.display = 'block';
    rotBadge.textContent   = Math.round(startRot) + '°';
    function onRotMove(ev) {
      const mx  = (ev.clientX - T.x) / T.s;
      const my  = (ev.clientY - T.y) / T.s;
      const ang = Math.atan2(my - cy_w, mx - cx_w) * 180 / Math.PI;
      data.rotation = startRot + (ang - startAng);
      tw.style.transform     = 'rotate(' + data.rotation + 'deg)';
      rotBadge.textContent   = Math.round(data.rotation) + '°';
    }
    function onRotUp() {
      window.removeEventListener('mousemove', onRotMove);
      window.removeEventListener('mouseup',   onRotUp);
      rotBadge.style.display = 'none';
      world.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
      document.body.style.userSelect = '';
      saveState();
    }
    window.addEventListener('mousemove', onRotMove);
    window.addEventListener('mouseup',   onRotUp);
    world.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = 'none');
    document.body.style.userSelect = 'none';
  });

  rotHandle.addEventListener('dblclick', e => {
    e.stopPropagation();
    data.rotation = 0;
    tw.style.transform = 'rotate(0deg)';
    tw.style.setProperty('--rot', '0deg');
    saveState();
  });

  tw.append(rotHandle, rotBadge, handle, body, resizeR, resizeBr);
  world.appendChild(tw);
  return tw;
}

/* =====================================================================
   Zoom-to-fit ("fullscreen") helpers
===================================================================== */
let _fsFrame = null;
let _fsPrevT  = null;   // saved transform to restore

function enterFs(fw, data) {
  if (_fsFrame) exitFs();

  _fsPrevT  = { x: T.x, y: T.y, s: T.s };
  _fsFrame  = fw;

  const dev        = DEVICES[data.device] || DEVICES.mobile;
  const frameW     = dev.outerW;
  const frameH     = dev.outerH;
  const labelH     = 36 + 8;           // label height + gap
  const barH       = document.body.classList.contains('bar-hidden') ? 0 : 58;
  const pad        = 32;

  const availW = innerWidth  - pad * 2;
  const availH = innerHeight - barH - pad * 2;

  const s = Math.min(availW / frameW, availH / (frameH + labelH));

  /* center the frame+label block in the available area */
  const totalH = (frameH + labelH) * s;
  const totalW = frameW * s;

  T.s = s;
  T.x = (innerWidth  - totalW) / 2 - data.x * s;
  T.y = barH + pad + labelH * s - data.y * s;

  applyT();
  saveState();
}

function exitFs() {
  if (!_fsPrevT) return;
  T.x = _fsPrevT.x;
  T.y = _fsPrevT.y;
  T.s = _fsPrevT.s;
  _fsFrame = null;
  _fsPrevT = null;
  applyT();
  saveState();
}

/* Escape exits zoom-to-fit */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && _fsFrame) exitFs();
});

  if (e.target.closest('.fw-label, .fw-close, .fw-open, .fw-devs, .tw-handle, .tw-close, .tw-body, .tw-resize-r, .tw-resize-br, #url-input, #add-btn, #text-btn, .z-btn, .blocked-link')) return;

  if (!e.target.closest('.fw')) {
    document.querySelectorAll('.fw.focused').forEach(el => el.classList.remove('focused'));
  }
  if (e.button === 1 || (e.button === 0 && spaceDown)) {
    e.preventDefault();
    panning = true;
    panStart.x = e.clientX - T.x;
    panStart.y = e.clientY - T.y;
    vp.style.cursor = 'grabbing';
  }
});

window.addEventListener('mousemove', e => {
  if (panning) {
    T.x = e.clientX - panStart.x;
    T.y = e.clientY - panStart.y;
    applyT();
    return;
  }
  if (dragging) {
    const cx = (e.clientX - T.x) / T.s;
    const cy = (e.clientY - T.y) / T.s;
    dragging.data.x = cx - dragging.ox;
    dragging.data.y = cy - dragging.oy;
    dragging.el.style.left = dragging.data.x + 'px';
    dragging.el.style.top  = dragging.data.y + 'px';
  }
});

window.addEventListener('mouseup', () => {
  if (panning) {
    panning = false;
    vp.style.cursor = spaceDown ? 'grab' : '';
    saveState();
  }
  if (dragging) {
    dragging = null;
    world.querySelectorAll('iframe').forEach(f => f.style.pointerEvents = '');
    document.body.style.userSelect = '';
    saveState();
  }
});

/* debounced save for continuous gestures (wheel, keyboard zoom) */
let _saveTimer = null;
function saveStateDeferred() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveState, 400);
}

vp.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    /* pinch-to-zoom or Ctrl+scroll */
    const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    zoomTo(T.s * factor, e.clientX, e.clientY);
  } else {
    /* two-finger scroll → pan */
    T.x -= e.deltaX;
    T.y -= e.deltaY;
    applyT();
  }
  saveStateDeferred();
}, { passive: false });

    spaceDown = true;

    if (e.key === '-')                  { e.preventDefault(); zoomTo(T.s / 1.2); saveStateDeferred(); }
    if (e.key === '0')                  { e.preventDefault(); resetView();        saveState(); }
  }
});

===================================================================== */
(function () {
  const tip = document.getElementById('tooltip');
  let current   = null;
  let showTimer = null;

  function show(el) {
    const text = el.dataset.tip;
    if (!text) return;
    tip.textContent = text;
    /* position centered above the element */
    tip.style.left = '0';
    tip.style.top  = '0';
    const rect = el.getBoundingClientRect();
    const tw   = tip.offsetWidth;
    const th   = tip.offsetHeight;
    const gap  = 8;
    let lx = rect.left + rect.width / 2;   /* center X (tip uses translateX(-50%)) */
    let ly = rect.top - th - gap;
    if (ly < 8) ly = rect.bottom + gap;    /* flip below if no room above */
    if (lx - tw / 2 < 8) lx = tw / 2 + 8;
    if (lx + tw / 2 > innerWidth - 8) lx = innerWidth - tw / 2 - 8;
    tip.style.left = lx + 'px';
    tip.style.top  = ly + 'px';
    tip.classList.add('visible');
  }

  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[title],[data-tip]');
    if (!el) return;
    if (el.hasAttribute('title')) {
      el.dataset.tip = el.getAttribute('title');
      el.removeAttribute('title');
    }
    if (current === el) return;
    current = el;
    clearTimeout(showTimer);
    showTimer = setTimeout(() => show(el), 320);
  });

  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    clearTimeout(showTimer);
    tip.classList.remove('visible');
    current = null;
  });

  document.addEventListener('mousedown', () => {
    clearTimeout(showTimer);
    tip.classList.remove('visible');
    current = null;
  });
})();

async function saveAsDefault() {

/* =====================================================================
   Config.json — defaults when there is no saved session
===================================================================== */
async function loadConfig() {
  try {
    const res = await fetch('./config.json');
    if (!res.ok) return;
    const cfg = await res.json();

    /* menu visibility */
    if (cfg.menu === 'oculto') {
      document.body.classList.add('bar-hidden');
      barToggleLbl.textContent = 'MOSTRAR';
      localStorage.setItem('bar_hidden', '1');
    }

    /* ── framesInicial: frames con posicion y dispositivo completos ── */
    if (Array.isArray(cfg.framesInicial) && cfg.framesInicial.length) {
      cfg.framesInicial.forEach(f => {
        const url = normalizeUrl(f.url);
        if (!url) return;
        const id   = idSeq++;
        const data = { id, url, device: f.device || 'mobile', x: f.x || 0, y: f.y || 0 };
        frames.push(data);
        buildFrame(data);
      });
      if (frames.length) emptyEl.classList.add('hidden');
      saveState();
    }

    const urls   = Array.isArray(cfg.urlsInicial) ? cfg.urlsInicial : [];
    const cfgDev = (cfg.device && DEVICES[cfg.device]) ? cfg.device : 'monitor';

    if (!cfg.framesInicial && urls.length) {
      if (urls.length === 1) {
        /* single URL → add in configured device then zoom-to-fit */
        const savedDev = selectedDevice;
        selectedDevice = cfgDev;
        addFrame(urls[0]);
        selectedDevice = savedDev;
        const frameData = frames[frames.length - 1];
        const fw = document.getElementById('fw-' + frameData.id);
        if (fw && frameData) enterFs(fw, frameData);
      } else {
        /* multiple URLs → configured device, arranged side by side */
        const GAP = 40;
        const dev = DEVICES[cfgDev];
        urls.forEach((url, i) => {
          const normalized = normalizeUrl(url);
          if (!normalized) return;
          const id   = idSeq++;
          const data = { id, url: normalized, device: cfgDev,
                          x: i * (dev.outerW + GAP), y: 0 };
          frames.push(data);
          buildFrame(data);
        });
        if (frames.length) emptyEl.classList.add('hidden');
        /* center canvas to show all frames */
        const totalW = frames.length * (dev.outerW + GAP) - GAP;
        T.s = Math.min(1, (innerWidth * 0.9) / totalW);
        T.x = (innerWidth  - totalW * T.s) / 2;
        T.y = (innerHeight - dev.outerH * T.s) / 2;
        applyT();
        saveState();
      }
    }

    /* default text nodes (loaded on reset and first run) */
    if (Array.isArray(cfg.textosInicial) && cfg.textosInicial.length) {
      cfg.textosInicial.forEach(t => {
        const id = idSeq++;
        const w  = t.w || 240;
        const x  = t.x === 'center' ? (innerWidth  / 2 - T.x) / T.s - w / 2 : (t.x || 0);
        const y  = t.y === 'center' ? (innerHeight / 2 - T.y) / T.s - 20     : (t.y || 0);
        const data = { id, text: t.text || '', x, y, w,
                        fontSize: t.fontSize || 18, rotation: t.rotation || 0 };
        texts.push(data);
        buildTextNode(data);
      });
      emptyEl.classList.add('hidden');
      saveState();
    }
  } catch (err) {
    console.warn('config.json no encontrado o inválido', err);
  }
}

/* =====================================================================
   Layers panel
===================================================================== */
const layersListEl = document.getElementById('layers-list');
const layersToggleEl = document.getElementById('layers-toggle');
const layersArrow = layersToggleEl.querySelector('.layers-arrow');

function toggleLayers() {
  const open = document.body.classList.toggle('layers-open');
  layersArrow.style.transform = open ? 'scaleX(-1)' : '';
}

layersToggleEl.addEventListener('click', toggleLayers);
layersToggleEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleLayers(); } });

function reorderByLayers(orderedItems) {
  const base = 100;
  const n = orderedItems.length;
  orderedItems.forEach((item, i) => {
    const z = base + (n - 1 - i);
    const el = document.getElementById((item._kind === 'frame' ? 'fw-' : 'tw-') + item.id);
    if (el) el.style.zIndex = z;
  });
  zSeq = base + n;
  saveState();
}

function renderLayers() {
  if (!layersListEl) return;
  const DEV_ICONS = { mobile: '📱', tablet: '⬜', desktop: '💻', monitor: '🖥' };
  const getZ = item => {
    const el = document.getElementById((item._kind === 'frame' ? 'fw-' : 'tw-') + item.id);
    return el ? (parseInt(el.style.zIndex) || 0) : 0;
  };
  const all = [
    ...frames.map(f => Object.assign({ _kind: 'frame' }, f)),
    ...texts.map(t  => Object.assign({ _kind: 'text'  }, t)),
  ].sort((a, b) => getZ(b) - getZ(a));

  layersListEl.innerHTML = '';
  let dragSrc = null;

  all.forEach(item => {
    const isHidden = item.visible === false;
    const li = document.createElement('div');
    li.className = 'layer-item' + (isHidden ? ' layer-hidden' : '');
    li.draggable = true;

    const grip = document.createElement('span');
    grip.className = 'layer-drag-handle';
    grip.textContent = '⠿';
    grip.title = 'Arrastrar para reordenar';

    const icon = document.createElement('span');
    icon.className = 'layer-icon' + (item._kind === 'text' ? ' layer-text-icon' : '');
    icon.textContent = item._kind === 'frame'
      ? (DEV_ICONS[item.device] || '🖥')
      : 'T';

    const name = document.createElement('span');
    name.className = 'layer-name';
    if (item._kind === 'frame') {
      try { name.textContent = new URL(item.url).hostname; } catch { name.textContent = item.url; }
    } else {
      name.textContent = (item.text || '').trim().slice(0, 24) || 'Texto…';
    }

    const eyeBtn = document.createElement('button');
    eyeBtn.className = 'layer-eye';
    eyeBtn.title     = isHidden ? 'Mostrar' : 'Ocultar';
    eyeBtn.textContent = isHidden ? '○' : '●';
    eyeBtn.addEventListener('click', e => { e.stopPropagation(); toggleVisibility(item._kind, item.id); });

    const delBtn = document.createElement('button');
    delBtn.className = 'layer-del';
    delBtn.title     = 'Eliminar';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (item._kind === 'frame') {
        removeFrame(item.id);
      } else {
        texts = texts.filter(t => t.id !== item.id);
        document.getElementById('tw-' + item.id)?.remove();
        if (!frames.length && !texts.length) emptyEl.classList.remove('hidden');
        saveState();
      }
    });

    /* drag-and-drop events */
    li.addEventListener('dragstart', e => {
      dragSrc = item;
      requestAnimationFrame(() => li.classList.add('layer-dragging'));
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', item.id); // required by Firefox
    });
    li.addEventListener('dragend', () => {
      li.classList.remove('layer-dragging');
      layersListEl.querySelectorAll('.layer-drag-over').forEach(el => el.classList.remove('layer-drag-over'));
      dragSrc = null;
    });
    li.addEventListener('dragover', e => {
      if (!dragSrc || dragSrc.id === item.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      layersListEl.querySelectorAll('.layer-drag-over').forEach(el => el.classList.remove('layer-drag-over'));
      li.classList.add('layer-drag-over');
    });
    li.addEventListener('dragleave', e => {
      if (!li.contains(e.relatedTarget)) li.classList.remove('layer-drag-over');
    });
    li.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragSrc || dragSrc.id === item.id) return;
      li.classList.remove('layer-drag-over');
      const srcIdx = all.findIndex(x => x._kind === dragSrc._kind && x.id === dragSrc.id);
      const dstIdx = all.findIndex(x => x._kind === item._kind   && x.id === item.id);
      if (srcIdx === -1 || dstIdx === -1) return;
      const [moved] = all.splice(srcIdx, 1);
      all.splice(dstIdx, 0, moved);
      reorderByLayers(all);
    });

    li.append(grip, icon, name, eyeBtn, delBtn);
    li.addEventListener('click', () => panToItem(item._kind, item.id));
    layersListEl.appendChild(li);
  });
}

function panToItem(kind, id) {
  let cx, cy;
  if (kind === 'frame') {
    const data = frames.find(f => f.id === id);
    if (!data) return;
    const dev = DEVICES[data.device] || DEVICES.mobile;
    cx = data.x + dev.outerW / 2;
    cy = data.y + dev.outerH / 2;
  } else {
    const data = texts.find(t => t.id === id);
    if (!data) return;
    const el = document.getElementById('tw-' + id);
    const h  = el ? el.offsetHeight : 40;
    cx = data.x + data.w / 2;
    cy = data.y + h / 2;
  }
  T.x = innerWidth  / 2 - cx * T.s;
  T.y = innerHeight / 2 - cy * T.s;
  applyT();
  saveStateDeferred();
}

function toggleVisibility(kind, id) {
  const list = kind === 'frame' ? frames : texts;
  const data = list.find(item => item.id === id);
  if (!data) return;
  data.visible = data.visible === false ? true : false;
  const el = document.getElementById((kind === 'frame' ? 'fw-' : 'tw-') + id);
  if (el) el.style.visibility = data.visible === false ? 'hidden' : '';
  saveState();
}

const _hasSavedState = loadState();
if (!_hasSavedState) {
  resetView();
  loadConfig();
}
renderLayers();

/* restore bar visibility */
if (localStorage.getItem('bar_hidden') === '1') {
  document.body.classList.add('bar-hidden');
  barToggleLbl.textContent = 'MOSTRAR';
}
</script>
